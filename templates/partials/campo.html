<div class="field{% if field.errors %} has-error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label>{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    {{ field.label_tag }}{{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="errors">{{ field.errors|join:" " }}</div>{% endif %}
</div>
