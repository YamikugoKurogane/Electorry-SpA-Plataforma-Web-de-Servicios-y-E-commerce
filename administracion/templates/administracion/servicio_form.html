{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f8fafc 0%, #eefaf7 100%); }
        .form-card { max-width: 760px; margin: 56px auto; border: none; border-radius: 20px; box-shadow: 0 18px 36px rgba(15, 23, 42, 0.08); }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card form-card">
            <div class="card-header bg-dark text-white py-3">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div>
                        <p class="text-uppercase text-light-emphasis mb-1">Servicios</p>
                        <h1 class="h3 mb-0">{{ titulo }}</h1>
                    </div>
                    <a href="{% url 'servicio_listar' %}" class="btn btn-light">Volver</a>
                </div>
            </div>
            <div class="card-body p-4 p-lg-5">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}</label>
                            {% if field.name == 'estado' %}
                                <div class="form-check form-switch mt-2">
                                    {{ field }}
                                    <label class="form-check-label" for="{{ field.id_for_label }}">Activo</label>
                                </div>
                            {% else %}
                                {{ field }}
                            {% endif %}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors|join:', ' }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'servicio_listar' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
