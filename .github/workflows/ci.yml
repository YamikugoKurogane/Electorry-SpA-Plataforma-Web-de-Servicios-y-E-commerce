name: CI
on:
  pull_request:
  push: { branches: [main] }
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: electorry, POSTGRES_USER: electorry, POSTGRES_PASSWORD: electorry }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U electorry" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_TESTING: "1"
      DATABASE_URL: postgres://electorry:electorry@localhost:5432/electorry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test tests -v 2
      - name: Chequeo de despliegue
        run: DJANGO_TESTING= DJANGO_SECRET_KEY=${{ github.sha }}${{ github.sha }}${{ github.sha }} DJANGO_ALLOWED_HOSTS=ejemplo.cl python manage.py check --deploy --fail-level WARNING

  respaldos:
    name: Respaldo y restauración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: electorry, POSTGRES_USER: electorry, POSTGRES_PASSWORD: electorry }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U electorry" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://electorry:electorry@localhost:5432/electorry
      PGHOST: localhost
      PGUSER: electorry
      PGPASSWORD: electorry
      PGDATABASE: electorry
      BACKUP_DIR: /tmp/backups
      MEDIA_DIR: /tmp/media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python manage.py migrate && python manage.py seed_demo
      - name: Archivos de ejemplo
        run: |
          mkdir -p "$MEDIA_DIR/adjuntos/1" "$BACKUP_DIR"
          head -c 4096 /dev/urandom > "$MEDIA_DIR/adjuntos/1/plano de prueba.bin"
      - name: Respaldo completo (base de datos + archivos)
        run: sh deploy/backup.sh
      - name: Prueba de restauración (debe terminar en RESTAURACIÓN VERIFICADA)
        run: sh deploy/probar_restauracion.sh
