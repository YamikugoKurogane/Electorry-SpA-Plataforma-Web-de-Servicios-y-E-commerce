name: CI
on:
  pull_request:
  push: { branches: [main] }
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: electorry, POSTGRES_USER: electorry, POSTGRES_PASSWORD: electorry }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U electorry" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_TESTING: "1"
      DATABASE_URL: postgres://electorry:electorry@localhost:5432/electorry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test tests -v 2
      - name: Chequeo de despliegue
        run: DJANGO_TESTING= DJANGO_SECRET_KEY=${{ github.sha }}${{ github.sha }}${{ github.sha }} DJANGO_ALLOWED_HOSTS=ejemplo.cl python manage.py check --deploy --fail-level WARNING
