upstream electorry { server web:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;   # 5 archivos de 5 MB + margen

    location /static/ { alias /app/staticfiles/; expires 7d; access_log off; }
    # Solo imágenes públicas de productos. Los adjuntos de solicitudes NO se exponen:
    # los entrega Django verificando propietario/rol.
    location /media/productos/ { alias /app/media/productos/; expires 7d; }
    location /media/ { return 404; }

    location / {
        proxy_pass http://electorry;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
# TLS: termina en el balanceador del proveedor cloud o con certbot sobre este Nginx.
# Con TLS directo en Nginx, cambia X-Forwarded-Proto a $scheme.
